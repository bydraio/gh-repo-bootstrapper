
  # Runs only when the release PR is merged (a Release was created). The
  # deploy/record steps below are further gated on vars.VERCEL_DEPLOY_ENABLED,
  # so this job can be turned on or off with `gh variable set` alone — no
  # workflow regeneration needed.
  # Requires: vars VERCEL_ORG_ID, VERCEL_PROJECT_ID, VERCEL_DEPLOY_ENABLED;
  # secret VERCEL_TOKEN.
  deploy:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Deploy to Vercel (production)
        if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
        id: deploy
        env:
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -o pipefail
          npm i -g vercel@56.3.2
          owner="${GITHUB_REPOSITORY%/*}"
          repo="${GITHUB_REPOSITORY#*/}"
          msg="$(git log -1 --pretty=%s)"
          author="$(git log -1 --pretty=%an)"
          url="$(vercel deploy --prod --yes --token="$VERCEL_TOKEN" \
            -m githubDeployment=1 \
            -m githubCommitSha="$GITHUB_SHA" \
            -m githubCommitMessage="$msg" \
            -m githubCommitRef="$GITHUB_REF_NAME" \
            -m githubCommitAuthorName="$author" \
            -m githubOrg="$owner" \
            -m githubRepo="$repo" \
            -m githubCommitOrg="$owner" \
            -m githubCommitRepo="$repo" | tail -n1)"
          case "$url" in https://*) ;; *) url="https://$url" ;; esac
          echo "Deployed: $url"
          # Tolerate 401/403 (Vercel deployment protection); fail on 5xx / unreachable.
          code="$(curl -s -o /dev/null -w '%{http_code}' "$url/" || echo 000)"
          echo "GET $url/ -> $code"
          if [ "$code" = "000" ] || [ "$code" -ge 500 ]; then
            echo "::error::Smoke check failed (HTTP $code) — staged build is unhealthy"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Record GitHub Deployment
        if: ${{ vars.VERCEL_DEPLOY_ENABLED == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          id="$(jq -nc --arg ref "$GITHUB_SHA" --arg tag "$TAG" \
            '{ref:$ref,environment:"Production",production_environment:true,auto_merge:false,required_contexts:[],description:("Release "+$tag)}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments" --method POST --input - --jq '.id')"
          jq -nc --arg url "$DEPLOY_URL" --arg tag "$TAG" \
            '{state:"success",environment:"Production",environment_url:$url,description:("Deployed "+$tag+" to Vercel production")}' \
            | gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" --method POST --input -

      - name: Explain disabled deployment
        if: ${{ vars.VERCEL_DEPLOY_ENABLED != 'true' }}
        run: |
          echo "::notice::Vercel deployment is disabled (vars.VERCEL_DEPLOY_ENABLED is not 'true')."
          echo "Set VERCEL_ORG_ID, VERCEL_PROJECT_ID, and VERCEL_TOKEN, then run:"
          echo "  gh variable set VERCEL_DEPLOY_ENABLED --body true"
          echo "to enable production deploys on future releases."
