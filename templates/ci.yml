name: ci

on:
  pull_request:

# Calling a reusable workflow passes this job's permissions to it, which can
# then only reduce them. Granting read here means no called suite can hold more
# than read access no matter what it declares.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/test.yml
    with:
      full: false
