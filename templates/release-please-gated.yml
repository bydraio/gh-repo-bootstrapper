name: release-please

# Job order: test -> release-please
# A tag and GitHub Release are only ever created for a commit that passes
# tests. release-please authenticates as a GitHub App (not GITHUB_TOKEN) so
# the release PR's commits and tags trigger other workflows normally.
#
# Requires: vars RELEASE_PLEASE_CLIENT_ID; secret RELEASE_PLEASE_APP_KEY.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  # Full suite only for the commit that is the Release Please PR merging
  # (its title/commit message is the fixed "chore(main): release X.Y.Z"
  # pattern release-please always uses). Every other push to main — an
  # ordinary feature/Dependabot merge — already passed this same suite at
  # PR time, so it gets the fast path only; it ships nothing and this run
  # gates nothing real.
  test:
    uses: ./.github/workflows/test.yml
    with:
      full: "${{ startsWith(github.event.head_commit.message, 'chore(main): release') }}"

  release-please:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
