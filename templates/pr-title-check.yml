name: pr-title-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-title:
    # Skip three classes of PR that cannot benefit from title validation:
    # already-merged PRs (editing the body — e.g. ticking a task-list box —
    # re-fires `edited`, but the squash subject is already in history and
    # cannot change), Release Please PRs (machine-generated titles, and rapid
    # events trip cancel-in-progress into spurious failures), and Dependabot
    # PRs (its grouped-update subject is capitalised, so the lowercase-subject
    # rule is deliberately limited to human-authored titles).
    if: >-
      github.event.pull_request.merged == false &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      !startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            build
            ci
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+
          subjectPatternError: |
            The subject "{subject}" found in the pull request title "{title}"
            didn't match the configured pattern. Please ensure that the subject
            doesn't start with an uppercase character.
